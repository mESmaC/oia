[package]
name = "oia-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Accepted ADR 0006 (D05) JSON round-trip form for evidence-ledger records. Both
# pins are already in Cargo.lock (used by oia-app and oia-image-forensics); no
# renderer, HTTP, database, model, or vendor dependency enters the domain core.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints]
workspace = true
