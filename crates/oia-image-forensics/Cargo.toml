[package]
name = "oia-image-forensics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded offline still-image forensic cues for OIA media workers"

[dependencies]
oia-png-privacy = { path = "../oia-png-privacy" }
oia-jpeg-privacy = { path = "../oia-jpeg-privacy" }
crc32fast = "=1.5.4"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }

[lints]
workspace = true
