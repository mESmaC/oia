[workspace]
resolver = "2"
members = [
    "crates/oia-domain",
    "crates/oia-time-geo",
    "crates/oia-store",
    "crates/oia-ingest",
    "crates/oia-query",
    "crates/oia-analysis",
    "crates/oia-models",
    "crates/oia-media",
    "crates/oia-devices",
    "crates/oia-forecast",
    "crates/oia-export",
    "crates/oia-app",
    "crates/oia-documents",
    "crates/oia-png-privacy",
    "crates/oia-jpeg-privacy",
]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/mESmaC/oia"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
