[package]
name = "oia-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
httpdate = "=1.0.3"
quick-xml = "=0.42.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.10.9"
oia-domain = { path = "../oia-domain" }
oia-time-geo = { path = "../oia-time-geo" }
oia-store = { path = "../oia-store" }

[lints]
workspace = true
