[package]
name = "oia-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "oia"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd"]

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true }

[[bin]]
name = "oia"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
tokio = { version = "=1.54.1", features = ["net"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
tauri = { version = "=2.12.5", optional = true }
rfd = { version = "=0.15.4", optional = true }
oia-documents = { path = "../oia-documents" }
oia-news-claims = { path = "../oia-news-claims" }
oia-png-privacy = { path = "../oia-png-privacy" }
oia-jpeg-privacy = { path = "../oia-jpeg-privacy" }
oia-image-forensics = { path = "../oia-image-forensics" }
oia-alpr-map = { path = "../oia-alpr-map" }
oia-domain = { path = "../oia-domain" }
oia-time-geo = { path = "../oia-time-geo" }
oia-store = { path = "../oia-store" }
oia-ingest = { path = "../oia-ingest" }
oia-query = { path = "../oia-query" }
oia-analysis = { path = "../oia-analysis" }
oia-models = { path = "../oia-models" }
oia-media = { path = "../oia-media" }
oia-devices = { path = "../oia-devices" }
oia-forecast = { path = "../oia-forecast" }
oia-export = { path = "../oia-export" }

[lints]
workspace = true
