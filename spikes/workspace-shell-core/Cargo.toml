[package]
name = "oia-shell-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Renderer-independent shell context, jobs, persistence, and fixture shared by the D01 renderer spikes"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
